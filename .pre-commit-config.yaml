# Hooks that declare no stages default to EVERY stage. Since git hooks are
# dispatched machine-wide via core.hooksPath, every hook type git fires
# (pre-commit, prepare-commit-msg, commit-msg, post-checkout, pre-push) reaches
# pre-commit, so a stage-agnostic hook ran once per type — gitleaks and the rest
# executed 3x per commit plus once per checkout and push. Pinning the default to
# pre-commit runs them exactly once, where they belong. Hooks that need another
# stage still say so explicitly (see conventional-pre-commit below).
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0.0
          - typer>=0.9.0
        args: [--ignore-missing-imports]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
      # Second gitleaks pass at pre-push, over the COMMITS being pushed. The stock
      # hook's entry is `gitleaks git --pre-commit --staged`, which reads the index;
      # at pre-push the index is empty, so listing `pre-push` in its stages runs a
      # scan of nothing and reports clean (CodeRabbit on #130). This one reads the
      # range pre-commit exposes for the push, so a secret that entered through
      # `--no-verify` or an amend is caught before it leaves the machine. Follow-up
      # left open by #126.
      - id: gitleaks
        alias: gitleaks-push
        name: Detect hardcoded secrets (pushed commits)
        stages: [pre-push]
        always_run: true
        entry: bash -c 'exec gitleaks git --redact --verbose --log-opts="${PRE_COMMIT_FROM_REF}..${PRE_COMMIT_TO_REF}" .'

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore]

  - repo: local
    hooks:
      # dotf is the fleet's tool; a clone without it fails this hook rather than
      # skipping it.
      - id: lessons-fmt
        name: Check docs/lessons format and that no index is committed
        entry: dotf lessons fmt --check --dir docs/lessons
        language: system
        pass_filenames: false
        files: ^docs/lessons/
