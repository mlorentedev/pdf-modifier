name: Mutation Testing

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    # A clean run takes ~20 min; past this something is hung, not slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install mutmut

      - name: Run mutmut
        working-directory: backend
        # Cap each process's address space. Mutants of the `while True` scan in
        # `_find_matches_in_merged` append without bound; uncapped, one of them
        # sometimes exhausted the runner's RAM before mutmut's timeout fired, and
        # the runner died mid-run (reported as "canceled"). Capped, the mutant
        # raises MemoryError and is counted as killed. The suite needs < 1 GB.
        run: |
          ulimit -v 3000000
          uv run mutmut run

      - name: Check mutation score
        working-directory: backend
        run: |
          uv run mutmut results || true
