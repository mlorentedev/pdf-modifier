name: Mutation Testing

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      # A change to the gate must run the gate.
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    # A clean run takes ~20 min; past this something is hung, not slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install mutmut==3.7.0

      - name: Run mutmut
        working-directory: backend
        # Cap each process's address space. Mutants of the `while True` scan in
        # `_find_matches_in_merged` append without bound; uncapped, one of them
        # sometimes exhausted the runner's RAM before mutmut's timeout fired, and
        # the runner died mid-run (reported as "canceled"). Capped, the mutant
        # raises MemoryError and is counted as killed. The suite needs < 1 GB.
        run: |
          ulimit -v 3000000
          uv run mutmut run

      - name: Check mutation score
        working-directory: backend
        # A ratchet, not the goal: AGENTS.md targets 70%, the suite measured 64.6%
        # when this gate started. Raise the floor as surviving mutants are killed;
        # never lower it to make a PR pass. Mutants without tests are excluded.
        env:
          MUTATION_SCORE_FLOOR: "64"
        run: |
          uv run mutmut export-cicd-stats
          python3 - <<'PY'
          import json, os, sys
          s = json.load(open("mutants/mutmut-cicd-stats.json"))
          caught = s["killed"] + s["timeout"]
          tested = caught + s["survived"] + s["suspicious"]
          if tested == 0:
              sys.exit("no tested mutants: the run did not complete")
          score = 100 * caught / tested
          floor = float(os.environ["MUTATION_SCORE_FLOOR"])
          print(f"mutation score {score:.1f}% ({caught}/{tested}), floor {floor:g}%, stats {s}")
          if score < floor:
              sys.exit(f"mutation score {score:.1f}% is below the {floor:g}% floor")
          PY
