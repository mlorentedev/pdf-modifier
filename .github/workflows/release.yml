name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.check-release.outputs.release_created }}
      tag_name: ${{ steps.check-release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if release was created
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The package lives at path "backend", so release-please-action names its
          # outputs with that prefix. The unprefixed release_created is only set for
          # a root (".") package and stayed empty here, which silently skipped every
          # publish job from v1.7.0 to v1.9.0.
          RELEASE_CREATED: ${{ steps.release.outputs['backend--release_created'] }}
          TAG_NAME: ${{ steps.release.outputs['backend--tag_name'] }}
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        run: |
          # Fail closed: when a release exists, it must be the backend one with both
          # backend outputs set. A renamed output or a moved package path turns the
          # run red instead of skipping the publish jobs.
          case "$RELEASES_CREATED" in
            true|false) ;;
            *) echo "::error::release-please-action no longer sets releases_created; check its outputs"; exit 1 ;;
          esac
          if [ "$RELEASES_CREATED" = "true" ]; then
            if ! printf '%s' "$PATHS_RELEASED" | jq -e 'type == "array" and any(.[]; . == "backend")' >/dev/null; then
              echo "::error::release created for paths_released='$PATHS_RELEASED', but this workflow only publishes path backend"
              exit 1
            fi
            if [ "$RELEASE_CREATED" != "true" ] || [ -z "$TAG_NAME" ]; then
              echo "::error::backend was released but backend--release_created/backend--tag_name are empty; publish jobs would be skipped"
              exit 1
            fi
          fi
          echo "release_created=$RELEASE_CREATED" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  # Run CI on the release-please PR branch and report status checks.
  release-pr-ci:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check if release branch exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          SHA=$(gh api "repos/${REPO}/git/ref/heads/release-please--branches--master" --jq '.object.sha' 2>/dev/null || echo "")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "exists=$( [ -n "$SHA" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check.outputs.exists == 'true'
        with:
          persist-credentials: false
          ref: release-please--branches--master
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: steps.check.outputs.exists == 'true'
        with:
          enable-cache: true

      - name: Run tests
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv
          uv pip install -e ".[dev]"
          cd .. && make check

      - name: Report status on release PR
        if: always() && steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.check.outputs.sha }}
          PY_VERSION: ${{ matrix.python-version }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE="failure"
          if [ "$JOB_STATUS" = "success" ]; then STATE="success"; fi
          gh api "repos/${REPO}/statuses/${SHA}" \
            -f state="$STATE" \
            -f context="test (${PY_VERSION})" \
            -f description="Release PR CI"

  publish-pypi:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.12

      - name: Build
        working-directory: backend
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (was release/v1 branch)
        with:
          skip-existing: true
          packages-dir: backend/dist/

  publish-docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_BACKEND: mlorentedev/pdf-modifier-api
      IMAGE_FRONTEND: mlorentedev/pdf-modifier-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-mcp:
    needs: [release-please, publish-pypi]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        working-directory: backend
        run: ../mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        working-directory: backend
        run: |
          # `mcp-publisher publish` asks the registry to validate the version against
          # PyPI, and PyPI's index can lag a finished upload by seconds. On v1.9.2 this
          # step started 7 s after `publish-pypi` completed and got a 404; the same job
          # passed on a re-run a minute later. The ordering is already explicit
          # (`needs: [release-please, publish-pypi]`), so the wait belongs here: retry the
          # validation race instead of losing the release to it. A publish that already
          # succeeded is not repeated -- the loop exits on the first success.
          for attempt in 1 2 3 4 5; do
            if ../mcp-publisher publish; then
              exit 0
            fi
            # No sleep after the last attempt: nothing follows it, and it made the
            # failure step wait 225 s instead of 150 s (CodeRabbit on #192).
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))
              echo "::warning::publish attempt ${attempt} failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::publish to the MCP registry failed after 5 attempts"
          exit 1
